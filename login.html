<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login to WattAware</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #f0f2f5;
    --bg-accent: radial-gradient(circle at 15% 10%, rgba(37,99,235,0.06), transparent 45%);
    --fg: #111827;
    --fg-muted: #6b7280;
    --card-bg: #ffffff;
    --card-border: #e5e7eb;
    --input-bg: #f9fafb;
    --input-border: #d1d5db;
    --input-fg: #111827;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --co2: #16a34a;
  }
  body.dark {
    --bg: #0b0f17;
    --bg-accent: radial-gradient(circle at 15% 10%, rgba(59,130,246,0.10), transparent 45%);
    --fg: #f3f4f6;
    --fg-muted: #9ca3af;
    --card-bg: #141a24;
    --card-border: #232c3a;
    --input-bg: #1b2330;
    --input-border: #2c3848;
    --input-fg: #f3f4f6;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --danger: #f87171;
    --danger-bg: rgba(220,38,38,0.12);
    --co2: #34d399;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-accent), var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ── Theme toggle ── */
  .toggle-theme {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--card-bg);
    color: var(--fg);
    border: 1px solid var(--card-border);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .toggle-theme:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Brand mark ── */
  .brand {
    position: fixed;
    top: 22px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--fg-muted);
  }
  .brand i { color: var(--accent); font-size: 18px; }

  /* ── Card ── */
  .login-container {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 2.25rem 2rem;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .header-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--co2));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 22px;
    color: #fff;
  }

  h2 {
    margin: 0 0 4px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }
  .subtitle {
    margin: 0 0 22px;
    font-size: 12.5px;
    color: var(--fg-muted);
  }

  .field { text-align: left; margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--fg-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--input-border);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--input-fg);
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder { color: var(--fg-muted); opacity: 0.7; }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  input.input-error { border-color: var(--danger); }

  .password-wrapper { position: relative; }
  .password-wrapper input { padding-right: 56px; }
  .toggle-password {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
  }
  .toggle-password:hover { background: rgba(37,99,235,0.08); }

  button {
    width: 100%;
    padding: 11px;
    margin-top: 4px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    border-radius: 10px;
    cursor: pointer;
    background-color: var(--accent);
    color: #fff;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background-color: var(--accent-hover); }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.65; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0;
    color: var(--fg-muted);
    font-size: 11.5px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .google-btn {
    background: var(--input-bg);
    color: var(--fg);
    border: 1px solid var(--input-border);
  }
  .google-btn:hover { background: var(--card-border); }

  .links {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--fg-muted);
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .links a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .links a:hover { text-decoration: underline; }
  .links .sep { color: var(--card-border); }

  #message {
    margin-top: 14px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--danger);
    background: var(--danger-bg);
    display: none;
    text-align: left;
  }
  #message.visible { display: block; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  .spinner.visible { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="brand"><i class="ti ti-bolt"></i> Wattaware</div>
  <button class="toggle-theme" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
    <i class="ti ti-moon" id="theme-icon"></i>
  </button>

  <div class="login-container">
    <div class="header-icon"><i class="ti ti-leaf"></i></div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to track your carbon footprint</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="toggle-password" onclick="togglePassword()" id="toggle-password-btn">Show</button>
      </div>
    </div>

    <button onclick="login()" id="login-btn">
      <span class="spinner" id="login-spinner"></span>
      <span id="login-btn-text">Log in</span>
    </button>

    <div class="divider">or</div>

    <button class="google-btn" onclick="googleLogin()" id="google-btn">
      <i class="ti ti-brand-google"></i>
      <span id="google-btn-text">Continue with Google</span>
    </button>

    <div class="links">
      <a href="signup.html">Create account</a>
      <span class="sep">·</span>
      <a href="#" onclick="resetPassword(); return false;">Forgot password?</a>
    </div>

    <div id="message"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>

  <script>
    const { ipcRenderer } = require('electron');

    const firebaseConfig = {
      apiKey: "AIzaSyDVNHHHN4UtYA8uQaL1n4oCWcI9_6E1gJ8",
      authDomain: "wattaware-718b3.firebaseapp.com",
      projectId: "wattaware-718b3",
      storageBucket: "wattaware-718b3.appspot.com",
      messagingSenderId: "46958510191",
      appId: "1:46958510191:web:9b259ae97ee67083d5cd9a",
      measurementId: "G-XNLFX18H7L"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    function showMessage(text) {
      const msg = document.getElementById('message');
      msg.innerText = text;
      msg.classList.add('visible');
    }
    function clearMessage() {
      const msg = document.getElementById('message');
      msg.classList.remove('visible');
      msg.innerText = '';
    }
    function setLoading(isLoading) {
      document.getElementById('login-btn').disabled = isLoading;
      document.getElementById('google-btn').disabled = isLoading;
      document.getElementById('login-spinner').classList.toggle('visible', isLoading);
      document.getElementById('login-btn-text').textContent = isLoading ? 'Signing in...' : 'Log in';
    }
    function friendlyError(error) {
      const map = {
        'auth/invalid-email':        'That email address looks invalid.',
        'auth/user-not-found':       'No account found with that email.',
        'auth/wrong-password':       'Incorrect password. Try again.',
        'auth/invalid-credential':   'Incorrect email or password.',
        'auth/too-many-requests':    'Too many attempts. Please wait and try again.',
        'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
        'auth/network-request-failed': 'Network error — check your connection.'
      };
      return map[error.code] || error.message;
    }

    async function login() {
      clearMessage();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      document.getElementById('email').classList.remove('input-error');
      document.getElementById('password').classList.remove('input-error');

      if (!email || !password) {
        showMessage('Please enter both email and password.');
        if (!email) document.getElementById('email').classList.add('input-error');
        if (!password) document.getElementById('password').classList.add('input-error');
        return;
      }

      setLoading(true);
      try {
        await auth.signInWithEmailAndPassword(email, password);
        localStorage.setItem('auth', 'true');
        ipcRenderer.send('login-success');
      } catch (error) {
        showMessage(friendlyError(error));
        setLoading(false);
      }
    }

    async function googleLogin() {
      clearMessage();
      setLoading(true);
      try {
        await auth.signInWithPopup(provider);
        localStorage.setItem('auth', 'true');
        ipcRenderer.send('login-success');
      } catch (error) {
        showMessage(friendlyError(error));
        setLoading(false);
      }
    }

    async function resetPassword() {
      const email = prompt("Enter your email to reset password:");
      if (email) {
        try {
          await auth.sendPasswordResetEmail(email);
          showMessage('Password reset link sent — check your inbox.');
          document.getElementById('message').style.color = 'var(--co2)';
        } catch (error) {
          showMessage(friendlyError(error));
        }
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle("dark");
      document.getElementById('theme-icon').className = isDark ? 'ti ti-sun' : 'ti ti-moon';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const toggleBtn = document.getElementById("toggle-password-btn");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleBtn.innerText = "Hide";
      } else {
        passwordInput.type = "password";
        toggleBtn.innerText = "Show";
      }
    }

    // Restore saved theme preference
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('theme-icon').className = 'ti ti-sun';
    }

    // Enter key submits
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
